<blui-drawer-layout [variant]="getVariant()" (backdropClick)="closeDrawer()" [width]="300">
  <blui-drawer blui-drawer [open]="isOpen()" [sideBorder]="true" class="app-navigation-drawer">
    <blui-drawer-header>
      <div blui-title-content style="display: flex; flex-direction: column; justify-content: center">
        <div class="mat-body-1">Brightlayer User Interface</div>
        <div style="display: flex; align-items: center">
          <div class="mat-subtitle-2">Developer Docs</div>
          <mat-chip-listbox class="framework-chip">
            <mat-chip>
              <img
                matChipAvatar
                src="assets/angular-shield.svg"
                alt="Angular logo"
                style="background-color: unset; height: 16px; width: 16px"
              />
              <div>Angular</div>
            </mat-chip>
          </mat-chip-listbox>
        </div>
      </div>
    </blui-drawer-header>
    <blui-drawer-body>
      <blui-drawer-nav-group title="Components" [divider]="false">
        @for (navItem of componentNavItems; track navItem) {
          <blui-drawer-nav-item
            [title]="navItem.title"
            [hidePadding]="true"
            [selected]="navItem.title === getSelectedItem()"
            activeItemBackgroundShape="round"
            (itemSelect)="selectItem(navItem)"
          >
            @for (nestedNavItem of navItem.children; track nestedNavItem) {
              <blui-drawer-nav-item
                [title]="nestedNavItem.title"
                [hidePadding]="false"
                [selected]="nestedNavItem.title === getSelectedItem()"
                activeItemBackgroundShape="round"
                (itemSelect)="selectItem(nestedNavItem)"
              >
              </blui-drawer-nav-item>
            }
          </blui-drawer-nav-item>
        }
      </blui-drawer-nav-group>
    </blui-drawer-body>
  </blui-drawer>
  <div blui-content class="drawer-content" [class.md]="isMedium()" [class.sm]="isSmall()">
    <mat-toolbar class="toolbar">
      @if (variant === 'temporary') {
        <button mat-icon-button (click)="openDrawer()" style="margin-right: 16px; margin-left: -16px">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h2>{{ toolbarTitle }}</h2>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </div>
</blui-drawer-layout>
