<blui-drawer-layout [variant]="$variant()" [width]="300" (backdropClick)="drawerState.setDrawerOpen(false)">
  <blui-drawer blui-drawer class="app-navigation-drawer" [open]="drawerState.$drawerOpen()" [sideBorder]="true">
    <blui-drawer-header class="app-navigation-header" (click)="goHome()">
      <div blui-title-content class="app-navigation-title">
        <div class="mat-subtitle-1">Brightlayer User Interface</div>
        <div class="app-navigation-subtitle">
          <span class="mat-body-2">Developer Docs</span>
          <span class="framework-chip">
            <img src="assets/angular-shield.svg" alt="" />
            Angular
          </span>
        </div>
      </div>
    </blui-drawer-header>
    <blui-drawer-body>
      <blui-drawer-nav-group title="Components" class="app-navigation-group">
        @for (navItem of navItems; track navItem.route) {
          <blui-drawer-nav-item
            [title]="navItem.title"
            [compact]="true"
            [hidePadding]="true"
            [selected]="isActive(navItem)"
            [expanded]="hasActiveChild(navItem)"
            activeItemBackgroundShape="round"
            (itemSelect)="selectItem(navItem)"
          >
            @for (child of navItem.children ?? []; track child.route) {
              <blui-drawer-nav-item
                [title]="child.title"
                [compact]="true"
                [hidePadding]="false"
                [selected]="isActive(child)"
                activeItemBackgroundShape="round"
                (itemSelect)="selectItem(child)"
              />
            }
          </blui-drawer-nav-item>
        }
      </blui-drawer-nav-group>
    </blui-drawer-body>
  </blui-drawer>

  <div blui-content class="drawer-content" [class.md]="viewport.$isMedium()" [class.sm]="viewport.$isSmall()">
    <mat-toolbar class="toolbar">
      @if ($variant() === 'temporary') {
        <button
          mat-icon-button
          class="toolbar-menu-button"
          aria-label="Open navigation"
          (click)="drawerState.setDrawerOpen(true)"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h2 class="toolbar-title">{{ $toolbarTitle() }}</h2>
      <blui-spacer />
      <button
        mat-icon-button
        [attr.aria-label]="theme.$mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [matTooltip]="theme.$mode() === 'dark' ? 'Light theme' : 'Dark theme'"
        (click)="theme.toggleMode()"
      >
        <mat-icon>{{ theme.$mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>
    <router-outlet />
  </div>
</blui-drawer-layout>
