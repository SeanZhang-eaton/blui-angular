<span
  class="pxb-progress-icon"
  [style.flexDirection]="$flexDirection()"
  [style.display]="$labelPosition() === 'center' ? '' : 'inline-flex'"
>
  @if ($showPercentLabel()) {
    <span
      class="pxb-progress-icon-label"
      [class.inverted]="$inverted()"
      [class.center]="$labelPosition() === 'center'"
      [style.color]="$labelColor()"
      [style.webkitTextStrokeWidth.px]="$labelPosition() === 'center' ? $size() / 60 : 0"
      [style.fontSize.px]="$labelSize() || $size() / 4"
      [style.height.px]="$labelPosition() === 'center' ? $size() : null"
      [style.width.px]="$labelPosition() === 'center' ? $size() : null"
      [style.lineHeight.px]="$labelPosition() === 'top' || $labelPosition() === 'bottom' ? null : $size()"
      [style.webkitTextStrokeColor]="$strokeColor()"
      [style.webkitTextFillColor]="$labelColor()"
      >{{ $percent() }}%</span
    >
  }
  <ng-content></ng-content>
</span>
