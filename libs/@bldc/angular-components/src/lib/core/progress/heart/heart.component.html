<pxb-progress-icon
  [size]="$size()"
  [labelPosition]="$labelPosition()"
  [percent]="$percent()"
  [showPercentLabel]="$showPercentLabel()"
  [labelColor]="$labelColor()"
  [labelSize]="$labelSize()"
  [color]="$color()"
>
  <svg
    [attr.height]="$size() + 'px'"
    [attr.width]="$size() + 'px'"
    x="0px"
    y="0px"
    viewBox="0 0 24 24"
    style="enable-background: new 0 0 24 24"
    xml:space="preserve"
  >
    @if ($outlined() && $backgroundColor()) {
      <path [attr.d]="basePath" [attr.fill]="$backgroundColor()" />
    }
    <path
      [attr.fill]="(!$outlined() && $backgroundColor()) || $color() || 'currentColor'"
      [attr.fill-opacity]="$outlined() || $percent() >= 100 || (!$outlined() && $backgroundColor()) ? '1' : '0.3'"
      [attr.d]="$resolvedPath()"
    />
    <clipPath id="pxb-heart-clip">
      <path
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      />
    </clipPath>
    <rect
      [attr.fill]="$color() || 'currentColor'"
      clip-path="url(#pxb-heart-clip)"
      x="2"
      [attr.y]="$startY() - (rv($percent(), 0, 100) * $fillHeight()) / 100"
      width="20"
      height="20"
    />
  </svg>
</pxb-progress-icon>
