<div class="blui-mobile-stepper-content">
  <div class="blui-mobile-stepper-back-button-wrapper">
    <ng-content select="[blui-back-button]"></ng-content>
  </div>
  @let activeStep = $activeStep();
  @if ($variant() === 'dots') {
    <div class="blui-mobile-stepper-dots">
      @for (step of $stepsArray(); track step; let index = $index) {
        <div
          class="blui-mobile-stepper-dot"
          [class.blui-mobile-stepper-dot-visited]="index < activeStep"
          [class.blui-mobile-stepper-dot-active]="index === activeStep"
          [class.blui-mobile-stepper-dot-unvisited]="index > activeStep"
        ></div>
      }
    </div>
  }
  @if ($variant() === 'text') {
    <div class="blui-subtitle-2">{{ activeStep + 1 }} / {{ $stepsArray().length }}</div>
  }
  @if ($variant() === 'progress') {
    <mat-progress-bar mode="determinate" [value]="$progressFill()" />
  }

  <div class="blui-mobile-stepper-next-button-wrapper">
    <ng-content select="[blui-next-button]"></ng-content>
  </div>
</div>
